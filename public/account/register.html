<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="/styles2.css">
</head>
<body>
    <h1>Create account</h1>
    <form id="registerForm">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" maxlength="30">

        <label for="email">Email (for your weekly grocery list)</label>
        <input type="email" id="email" required>

        <label for="password">Password (8+ characters)</label>
        <input type="password" id="password" required minlength="8" maxlength="72">

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required>

        <button type="submit">Create account</button>
    </form>
    <p id="message"></p>
    <p>Already have an account? <a href="/account/login.html">Log in</a></p>

    <script>
        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if(password !== confirmPassword){
                message.textContent = 'Passwords do not match';
                return;
            }

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, email, password})
            });
            const data = await response.json();

            if(response.ok){
                form.reset();
                message.innerHTML = 'Account created! <a href="/account/login.html">Log in here</a>';
            } else {
                message.textContent = data.error;
            }
        });
    </script>
</body>
</html>
